    const article = {"slug": "2026-09-30-horizon-news", "title": "2026-09-30 每日资讯日报", "date": "2026-09-30", "tag": "AI 日报", "readtime": "9 分钟", "excerpt": "从 252 条内容中筛选出 10 条重要资讯。", "content": "\n<blockquote>从 252 条内容中筛选出 10 条重要资讯。</blockquote>\n\n<hr>\n\n<p><strong>科技新闻</strong></p>\n<ul>\n<li><a href=\"#item-tech-news-1\">GPT 6.1 Sol: Near-Astra intelligence for a fifth of the price</a> ⭐️ 8.0/10</li>\n<li><a href=\"#item-tech-news-2\">Livenerf: Has Opus 5.5 been nerfed yet?</a> ⭐️ 5.0/10</li>\n</ul>\n\n<p><strong>生物与生命科学</strong></p>\n<ul>\n<li><a href=\"#item-bio-news-1\">Assay-Aware BindingDB: Curating Experimental Context for Binding Affinity Prediction</a> ⭐️ 6.0/10</li>\n<li><a href=\"#item-bio-news-2\">KoopCell: Koopman-Based Generative Model for Learning Single-Cell Dynamics from Distribution Snapshots</a> ⭐️ 6.0/10</li>\n<li><a href=\"#item-bio-news-3\">Robust Biomolecular Complex Design Across Protein Conformational Landscapes</a> ⭐️ 6.0/10</li>\n<li><a href=\"#item-bio-news-4\">Explainable Deep Learning of Resting-State Functional Connectomes Reveals Network Biomarkers of Adolescent Intelligence</a> ⭐️ 5.0/10</li>\n<li><a href=\"#item-bio-news-5\">Life-time patterns of reinfections: epidemic cohorts as traveling waves</a> ⭐️ 5.0/10</li>\n<li><a href=\"#item-bio-news-6\">An interactive simulator for integrating biochemical models with experimental data</a> ⭐️ 5.0/10</li>\n<li><a href=\"#item-bio-news-7\">Beyond Gaussian Assumptions: Distribution-Aware Channel Capacity for Effective Connectivity</a> ⭐️ 5.0/10</li>\n<li><a href=\"#item-bio-news-8\">Harmonic Theory of Behavior</a> ⭐️ 5.0/10</li>\n</ul>\n\n<hr>\n\n<h2>科技新闻</h2>\n\n<a id=\"item-tech-news-1\"></a>\n<h3><a href=\"https://openai.com/index/introducing-gpt-6-1-sol/\" target=\"_blank\" rel=\"noopener\">GPT 6.1 Sol: Near-Astra intelligence for a fifth of the price</a> ⭐️ 8.0/10</h3>\n\n<p>OpenAI announces GPT 6.1 Sol, claiming near-Astra performance at one-fifth the price alongside steep cuts to cached input costs.</p>\n\n<p>hackernews · crorella · 9月29日 17:06 · <a href=\"https://news.ycombinator.com/item?id=49896586\" target=\"_blank\" rel=\"noopener\">社区讨论</a></p>\n\n<p><strong>标签</strong>: <code>#artificial intelligence</code>, <code>#large language models</code>, <code>#openai</code>, <code>#ai infrastructure</code>, <code>#machine learning</code></p>\n\n<hr>\n\n<a id=\"item-tech-news-2\"></a>\n<h3><a href=\"https://github.com/ninjahawk/livenerf\" target=\"_blank\" rel=\"noopener\">Livenerf: Has Opus 5.5 been nerfed yet?</a> ⭐️ 5.0/10</h3>\n\n<p>Livenerf tracks potential post-launch performance degradation in major language models, sparking community debate on AI evaluation and model drift.</p>\n\n<p>hackernews · bryan0 · 9月29日 22:36 · <a href=\"https://news.ycombinator.com/item?id=49901736\" target=\"_blank\" rel=\"noopener\">社区讨论</a></p>\n\n<p><strong>标签</strong>: <code>#artificial intelligence</code>, <code>#large language models</code>, <code>#benchmarking</code>, <code>#machine learning</code></p>\n\n<hr>\n\n<h2>生物与生命科学</h2>\n\n<a id=\"item-bio-news-1\"></a>\n<h3><a href=\"https://arxiv.org/abs/2609.34001\" target=\"_blank\" rel=\"noopener\">Assay-Aware BindingDB: Curating Experimental Context for Binding Affinity Prediction</a> ⭐️ 6.0/10</h3>\n\n<p>Researchers introduced Assay-Aware BindingDB, using an agentic extraction framework to curate experimental assay context that improves protein-ligand binding affinity prediction models.</p>\n\n<p>rss · arXiv q-bio · 9月29日 04:00</p>\n\n<p><strong>标签</strong>: <code>#Computational Chemistry</code>, <code>#Drug Discovery</code>, <code>#Protein-Ligand Binding</code>, <code>#Machine Learning</code>, <code>#Bioinformatics</code></p>\n\n<hr>\n\n<a id=\"item-bio-news-2\"></a>\n<h3><a href=\"https://arxiv.org/abs/2609.33350\" target=\"_blank\" rel=\"noopener\">KoopCell: Koopman-Based Generative Model for Learning Single-Cell Dynamics from Distribution Snapshots</a> ⭐️ 6.0/10</h3>\n\n<p>Researchers developed KoopCell, a generative machine learning framework grounded in Koopman-Mori-Zwanzig theory that models single-cell developmental dynamics and cell branching from snapshot RNA-sequencing data.</p>\n\n<p>rss · arXiv q-bio · 9月29日 04:00</p>\n\n<p><strong>标签</strong>: <code>#Computational Biology</code>, <code>#Single-Cell Dynamics</code>, <code>#scRNA-seq</code>, <code>#Machine Learning</code>, <code>#Generative Models</code></p>\n\n<hr>\n\n<a id=\"item-bio-news-3\"></a>\n<h3><a href=\"https://arxiv.org/abs/2609.33726\" target=\"_blank\" rel=\"noopener\">Robust Biomolecular Complex Design Across Protein Conformational Landscapes</a> ⭐️ 6.0/10</h3>\n\n<p>Researchers introduce FlexEvo, a model-agnostic computational framework that optimizes biomolecular binders across diverse target protein conformations without requiring retraining or pre-existing conformational ensembles.</p>\n\n<p>rss · arXiv q-bio · 9月29日 04:00</p>\n\n<p><strong>标签</strong>: <code>#Protein Design</code>, <code>#Computational Biology</code>, <code>#Structural Biology</code>, <code>#Machine Learning</code></p>\n\n<hr>\n\n<a id=\"item-bio-news-4\"></a>\n<h3><a href=\"https://arxiv.org/abs/2609.33422\" target=\"_blank\" rel=\"noopener\">Explainable Deep Learning of Resting-State Functional Connectomes Reveals Network Biomarkers of Adolescent Intelligence</a> ⭐️ 5.0/10</h3>\n\n<p>Researchers developed an explainable deep learning framework using functional MRI data from over 5,000 adolescents to predict intelligence metrics and map underlying functional network architectures.</p>\n\n<p>rss · arXiv q-bio · 9月29日 04:00</p>\n\n<p><strong>标签</strong>: <code>#Neuroinformatics</code>, <code>#Deep Learning</code>, <code>#Functional MRI</code>, <code>#Neurodevelopment</code>, <code>#Connectomics</code></p>\n\n<hr>\n\n<a id=\"item-bio-news-5\"></a>\n<h3><a href=\"https://arxiv.org/abs/2609.33466\" target=\"_blank\" rel=\"noopener\">Life-time patterns of reinfections: epidemic cohorts as traveling waves</a> ⭐️ 5.0/10</h3>\n\n<p>Researchers developed a &amp;\\#x27;chain SIR&amp;\\#x27; mathematical model that tracks individual reinfection histories as traveling waves, enabling quantification of immune-driven reductions in reinfection rates for seasonal respiratory viruses.</p>\n\n<p>rss · arXiv q-bio · 9月29日 04:00</p>\n\n<p><strong>标签</strong>: <code>#Epidemiology</code>, <code>#Infectious Diseases</code>, <code>#Mathematical Modeling</code>, <code>#Influenza</code>, <code>#Respiratory Syncytial Virus</code></p>\n\n<hr>\n\n<a id=\"item-bio-news-6\"></a>\n<h3><a href=\"https://arxiv.org/abs/2609.34186\" target=\"_blank\" rel=\"noopener\">An interactive simulator for integrating biochemical models with experimental data</a> ⭐️ 5.0/10</h3>\n\n<p>Researchers introduce DeskIridium and WebIridium, open-source desktop and web-based tools that enable interactive, human-readable biochemical modeling and SBML simulation for experimental biologists.</p>\n\n<p>rss · arXiv q-bio · 9月29日 04:00</p>\n\n<p><strong>标签</strong>: <code>#Systems Biology</code>, <code>#Biochemical Modeling</code>, <code>#Simulation Software</code>, <code>#SBML</code></p>\n\n<hr>\n\n<a id=\"item-bio-news-7\"></a>\n<h3><a href=\"https://arxiv.org/abs/2609.32774\" target=\"_blank\" rel=\"noopener\">Beyond Gaussian Assumptions: Distribution-Aware Channel Capacity for Effective Connectivity</a> ⭐️ 5.0/10</h3>\n\n<p>Researchers developed a distribution-aware information-theoretic framework using normalizing flows to estimate directed brain connectivity under non-Gaussian noise conditions.</p>\n\n<p>rss · arXiv q-bio · 9月29日 04:00</p>\n\n<p><strong>标签</strong>: <code>#neuroscience</code>, <code>#effective connectivity</code>, <code>#computational biology</code>, <code>#neuroimaging</code>, <code>#information theory</code></p>\n\n<hr>\n\n<a id=\"item-bio-news-8\"></a>\n<h3><a href=\"https://arxiv.org/abs/2609.33896\" target=\"_blank\" rel=\"noopener\">Harmonic Theory of Behavior</a> ⭐️ 5.0/10</h3>\n\n<p>Researchers introduce a mathematical theory that derives animal movement, spatial choices, and collective behavior from the harmonic decomposition of neural representations of space.</p>\n\n<p>rss · arXiv q-bio · 9月29日 04:00</p>\n\n<p><strong>标签</strong>: <code>#neuroscience</code>, <code>#computational-neuroscience</code>, <code>#collective-behavior</code>, <code>#behavioral-biology</code></p>\n\n<hr>"};
