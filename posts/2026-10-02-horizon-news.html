/code></p>\n\n<hr>\n\n<h2>生物与生命科学</h2>\n\n<a id=\"item-bio-news-1\"></a>\n<h3><a href=\"https://arxiv.org/abs/2609.40359\" target=\"_blank\" rel=\"noopener\">Removing Timing Shortcuts Improves Non-Invasive Brain-to-Text</a> ⭐️ 6.0/10</h3>\n\n<p>Researchers expose a data-leakage shortcut in non-invasive speech decoding methods and introduce a simple fix that achieves a 36.6% word error rate on perceived speech.</p>\n\n<p>rss · arXiv q-bio · 10月1日 04:00</p>\n\n<p><strong>标签</strong>: <code>#brain-computer interface</code>, <code>#neurotechnology</code>, <code>#speech decoding</code>, <code>#machine learning</code></p>\n\n<hr>\n\n<a id=\"item-bio-news-2\"></a>\n<h3><a href=\"https://arxiv.org/abs/2604.25415\" target=\"_blank\" rel=\"noopener\">Single-turn emergency psychiatric triage across 15 frontier AI chatbots</a> ⭐️ 6.0/10</h3>\n\n<p>An evaluation of 15 frontier AI chatbots on single-turn psychiatric triage revealed that while most emergencies are identified, models miss 5.5% of emergency cases and systematically over-triage less urgent presentations.</p>\n\n<p>rss · arXiv q-bio · 10月1日 04:00</p>\n\n<p><strong>标签</strong>: <code>#Artificial Intelligence</code>, <code>#Psychiatry</code>, <code>#Digital Health</code>, <code>#Medical Triage</code>, <code>#Clinical Decision Support</code></p>\n\n<hr>\n\n<a id=\"item-bio-news-3\"></a>\n<h3><a href=\"https://arxiv.org/abs/2609.40202\" target=\"_blank\" rel=\"noopener\">Covariance Eigenspace Provides Latent Attribution of Longitudinal Effects in Brain Age Gap</a> ⭐️ 5.0/10</h3>\n\n<p>Researchers demonstrate that a covariance neural network eigenspectrum captures 83.2% of longitudinal brain age gap effects in mild cognitive impairment cohorts, substantially outperforming individual brain region attributions.</p>\n\n<p>rss · arXiv q-bio · 10月1日 04:00</p>\n\n<p><strong>标签</strong>: <code>#Brain Age Gap</code>, <code>#Neuroimaging</code>, <code>#Machine Learning</code>, <code>#Mild Cognitive Impairment</code>, <code>#Biomarkers</code></p>\n\n<hr>\n\n<a id=\"item-bio-news-4\"></a>\n<h3><a href=\"https://arxiv.org/abs/2609.40204\" target=\"_blank\" rel=\"noopener\">Attraction to hierarchical feature memory explains orientation bias</a> ⭐️ 5.0/10</h3>\n\n<p>Researchers demonstrate that anti-cardinal bias in visual orientation recall can be explained by attraction to hierarchical feature memory traces rather than non-uniform sensory coding noise.</p>\n\n<p>rss · arXiv q-bio · 10月1日 04:00</p>\n\n<p><strong>标签</strong>: <code>#Computational Neuroscience</code>, <code>#Visual Perception</code>, <code>#Cognitive Psychology</code>, <code>#Sensory Processing</code></p>\n\n<hr>\n\n<a id=\"item-bio-news-5\"></a>\n<h3><a href=\"https://arxiv.org/abs/2609.38218\" target=\"_blank\" rel=\"noopener\">A proof-carrying architecture for synthetic genetic logic circuits under stochastic temporal contracts</a> ⭐️ 5.0/10</h3>\n\n<p>Researchers introduce Proof-Carrying Synthetic Biology \\(PCS-Bio\\), a formal architecture that uses stochastic temporal contracts and program slicing to verify genetic logic circuits.</p>\n\n<p>rss · arXiv q-bio · 10月1日 04:00</p>\n\n<p><strong>标签</strong>: <code>#synthetic-biology</code>, <code>#genetic-circuits</code>, <code>#formal-verification</code>, <code>#design-automation</code></p>\n\n<hr>\n\n<a id=\"item-bio-news-6\"></a>\n<h3><a href=\"https://arxiv.org/abs/2604.18637\" target=\"_blank\" rel=\"noopener\">NeuroAI and Beyond: Bridging Between Advances in Neuroscience and Artificial Intelligence</a> ⭐️ 5.0/10</h3>\n\n<p>Leading researchers present a NeuroAI roadmap derived from an NSF workshop, detailing how neuroscience principles can resolve core AI challenges in efficiency, physical interaction, and adaptable learning.</p>\n\n<p>rss · arXiv q-bio · 10月1日 04:00</p>\n\n<p><strong>标签</strong>: <code>#NeuroAI</code>, <code>#Neuroscience</code>, <code>#Artificial Intelligence</code>, <code>#Computational Neuroscience</code>, <code>#Research Roadmap</code></p>\n\n<hr>"};
