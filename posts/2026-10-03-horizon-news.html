签</strong>: <code>#apple</code>, <code>#ios-development</code>, <code>#apple-wallet</code>, <code>#developer-tools</code></p>\n\n<hr>\n\n<h2>生物与生命科学</h2>\n\n<a id=\"item-bio-news-1\"></a>\n<h3><a href=\"https://arxiv.org/abs/2610.01358\" target=\"_blank\" rel=\"noopener\">Fold&amp;\\#x27;EM: Direct atomic structure inference from Cryo-EM particles</a> ⭐️ 6.0/10</h3>\n\n<p>Fold&amp;\\#x27;EM combines generative protein model priors directly with cryo-EM particle images to determine atomic structures and resolve conformational heterogeneity from low sample counts.</p>\n\n<p>rss · arXiv q-bio · 10月2日 04:00</p>\n\n<p><strong>标签</strong>: <code>#Cryo-EM</code>, <code>#Structural Biology</code>, <code>#Protein Structure Prediction</code>, <code>#Machine Learning</code>, <code>#Computational Biology</code></p>\n\n<hr>\n\n<a id=\"item-bio-news-2\"></a>\n<h3><a href=\"https://arxiv.org/abs/2610.00665\" target=\"_blank\" rel=\"noopener\">Analysis of Quantized and Efficiently Adapted Protein Language Models</a> ⭐️ 6.0/10</h3>\n\n<p>A comprehensive benchmark demonstrates that 4-bit quantization and QLoRA significantly reduce GPU memory usage for protein language models while largely preserving predictive performance and generated structural properties.</p>\n\n<p>rss · arXiv q-bio · 10月2日 04:00</p>\n\n<p><strong>标签</strong>: <code>#protein language models</code>, <code>#computational biology</code>, <code>#machine learning</code>, <code>#bioinformatics</code>, <code>#protein engineering</code></p>\n\n<hr>\n\n<a id=\"item-bio-news-3\"></a>\n<h3><a href=\"https://arxiv.org/abs/2610.00602\" target=\"_blank\" rel=\"noopener\">CPathOGen: Spatially and Morphologically Controlled H&amp;amp;E Counterfactuals for Probing Pathology Models</a> ⭐️ 5.0/10</h3>\n\n<p>Researchers developed CPathOGen, a conditional diffusion framework that generates realistic H&amp;amp;E counterfactual images to audit computational pathology models for robustness and feature sensitivity.</p>\n\n<p>rss · arXiv q-bio · 10月2日 04:00</p>\n\n<p><strong>标签</strong>: <code>#computational pathology</code>, <code>#digital pathology</code>, <code>#machine learning</code>, <code>#histopathology</code>, <code>#generative AI</code></p>\n\n<hr>\n\n<a id=\"item-bio-news-4\"></a>\n<h3><a href=\"https://arxiv.org/abs/2610.00672\" target=\"_blank\" rel=\"noopener\">ORBIT-FMIB: Tracking Order-Resolved Epistatic Information Through ESM-2</a> ⭐️ 5.0/10</h3>\n\n<p>Researchers present ORBIT-FMIB, a diagnostic framework designed to probe epistatic interaction representations in protein foundation models, though initial findings on ESM-2 proved non-robust upon replication.</p>\n\n<p>rss · arXiv q-bio · 10月2日 04:00</p>\n\n<p><strong>标签</strong>: <code>#protein foundation models</code>, <code>#epistasis</code>, <code>#computational biology</code>, <code>#machine learning</code></p>\n\n<hr>\n\n<a id=\"item-bio-news-5\"></a>\n<h3><a href=\"https://arxiv.org/abs/2502.04892\" target=\"_blank\" rel=\"noopener\">Stochastic Optimal Control for Continuous-Time fMRI Representation Learning</a> ⭐️ 5.0/10</h3>\n\n<p>Researchers present a novel stochastic optimal control framework that models fMRI brain activity as continuous-time latent dynamics to improve representation learning across heterogeneous neuroimaging datasets.</p>\n\n<p>rss · arXiv q-bio · 10月2日 04:00</p>\n\n<p><strong>标签</strong>: <code>#fMRI</code>, <code>#Computational Neuroscience</code>, <code>#Neuroimaging</code>, <code>#Machine Learning</code>, <code>#Representation Learning</code></p>\n\n<hr>\n\n<a id=\"item-bio-news-6\"></a>\n<h3><a href=\"https://arxiv.org/abs/2503.08838\" target=\"_blank\" rel=\"noopener\">PUMA: Learning a Mutation-Aware Vocabulary of Protein Units</a> ⭐️ 5.0/10</h3>\n\n<p>Researchers introduced PUMA, an algorithm that creates biologically grounded protein sequence vocabularies by grouping mutational variants into unit families, improving tokenization efficiency for protein language models.</p>\n\n<p>rss · arXiv q-bio ·
